name: Release

# Push a tag like v0.2.0 to build Linux + Windows packages and publish them as a GitHub release.
# "Run workflow" (manual) builds the packages as downloadable artifacts without publishing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version number for a test build (not published)
        required: false
        default: 0.0.0-dev

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${INPUT_VERSION:-0.0.0-dev}"; fi
          echo "Building version $VERSION"
          npm pkg set version="$VERSION"
      - run: npm ci --ignore-scripts
      - run: npx electron-vite build
      - name: Package (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: sshbar-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Signing key check
        if: env.HAS_KEY != 'true'
        run: echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — skipping the Android APK (see README → Releases)"
      - uses: actions/setup-node@v7
        if: env.HAS_KEY == 'true'
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Set version
        if: env.HAS_KEY == 'true'
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${INPUT_VERSION:-0.0.0-dev}"; fi
          npm pkg set version="$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - if: env.HAS_KEY == 'true'
        run: npm ci --ignore-scripts
      - if: env.HAS_KEY == 'true'
        run: npm run build:mobile && npx cap sync android
      - name: Build signed APK
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SSHBAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SSHBAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sshbar-release.jks"
          SSHBAR_KEYSTORE="$RUNNER_TEMP/sshbar-release.jks" ./gradlew assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/sshbar-release.jks"
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk "../dist/SSHbar-$VERSION-android.apk"
      - uses: actions/upload-artifact@v7
        if: env.HAS_KEY == 'true'
        with:
          name: sshbar-android
          if-no-files-found: error
          path: dist/*.apk

  release:
    needs: [build, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          name: SSHbar ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
